name: ✨ Feature request
description: Suggest an idea or improvement for the template
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Feature requests for Vantage Admin are evaluated against one question:
        **does this make the template more useful to people who will replace the
        mock backend with their own?** Please frame your proposal accordingly.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that the template doesn't support well today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Sketch the API/UI if you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or templates you looked at.

  - type: checkboxes
    id: constraints
    attributes:
      label: Template constraints
      description: The project deliberately avoids certain dependencies — confirm your idea fits.
      options:
        - label: This can be built without adding new runtime dependencies (no chart/form/CSS libraries)
          required: true
