            "url": "https://vital-admin-template.vercel.app/",
            "name": "Vital Admin",
            "description": "Free, open-source React admin template built with TypeScript and Vite.",
            "inLanguage": "en",

          },

            "name": "Vital Admin",

            "description": "Free, open-source React admin template built with TypeScript and Vite. Provides a production-oriented foundation for admin dashboards, SaaS applications, CRM systems, analytics platforms, ecommerce dashboards, and internal tools.",

    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong color scheme. Mirrors the logic in src/app/providers/ThemeProvider.tsx
      ;(function () {
        try {
          var stored =
            localStorage.getItem('vital.theme') || localStorage.getItem('vantage.theme')
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'light'
          document.documentElement.dataset.theme = theme === 'system' ? 'light' : theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
