<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Vital Admin — a production-ready React + TypeScript admin template with a mock API layer, dark mode, and a fully typed architecture."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vital Admin — React Admin Template" />
    <meta
      property="og:description"
      content="Production-ready React + TypeScript admin template with a swappable mock API layer."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vital Admin · React Admin Template</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong color scheme. Mirrors the logic in src/app/providers/ThemeProvider.tsx
      ;(function () {
        try {
          var stored = localStorage.getItem('vital.theme') || localStorage.getItem('vantage.theme')
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'light'
          document.documentElement.dataset.theme = theme === 'system' ? 'light' : theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
